name: Deploy using SSH to Server

on: [push, workflow_dispatch]

jobs:
    build:
        runs-on: ubuntu-latest

        environment:
            name: ${{ github.ref_name }}

        concurrency:
            group:
                # only ever run one deploy job at a time
                ${{ github.workflow }}

        steps:
            - uses: actions/checkout@v3
              with:
                  submodules: recursive

            - name: Export environment variables
              env:
                  SECRETS: ${{ toJson(secrets) }}
                  VARS: ${{ toJson(vars) }}
              run: |
                  set -euo pipefail

                  # Where you want the .env file
                  OUT_FILE=".env"

                  # Truncate existing file
                  : > "$OUT_FILE"

                  dump_json_to_env() {
                      local json="$1"

                      # Ignore empty / unset / "null"
                      [ -z "${json:-}" ] && return
                      [ "$json" = "null" ] && return

                      jq -r '
                          to_entries[]
                          | select(.key | test("^(?i)(github_|deploy_)") | not)
                          | [.key, (.value | tostring)]
                          | @tsv
                      ' <<<"$json" | while IFS=$'\t' read -r key value; do
                          # Escape quotes inside value
                          safe_value=$(printf '%s' "$value" | sed 's/"/\\"/g')

                          # Print as "KEY="value""
                          printf '%s="%s"\n' "$key" "$safe_value" >> "$OUT_FILE"
                      done
                  }

                  # Order matters: later lines override earlier ones if keys collide.
                  # e.g. VARS first, then SECRETS override them:
                  dump_json_to_env "${VARS:-}"
                  dump_json_to_env "${SECRETS:-}"

            - # https://github.com/marketplace/actions/ssh-deploy
              name: Deploy to server using SSH
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
                  ARGS: -rlgoDzc --stats -i --delete --exclude-from=.gitignore
                  SOURCE: /
                  TARGET: ~/${{ github.event.repository.name }}
                  REMOTE_HOST: ${{ vars.DEPLOY_HOST }}
                  REMOTE_USER: ${{ vars.DEPLOY_USER }}
                  EXCLUDE: /.git/
                  SCRIPT_BEFORE: |
                      cd ~/

                      # stop the app
                      if [ -d "${{ github.event.repository.name }}" ]; then
                          pushd "${{ github.event.repository.name }}"
                          docker compose down
                          popd
                      fi

                      # stop yxorp
                      if [ -d "yxorp" ]; then
                          pushd yxorp
                          docker compose down
                          popd
                      fi
                  SCRIPT_AFTER: |
                      cd ~/

                      # ensure yxorp is installed next to the app & up to date
                      if [ -d "yxorp" ]; then
                          pushd yxorp
                          git fetch
                          git pull
                          cp "../${{ github.event.repository.name }}/.env" .env
                          docker compose up -d --build
                          popd
                      else
                          git clone https://github.com/sxxov/yxorp
                          pushd yxorp
                          cp "../${{ github.event.repository.name }}/.env" .env
                          docker compose up -d --build
                          popd
                      fi

                      pushd ${{ github.event.repository.name }}
                      docker compose up -d --build
                      popd
