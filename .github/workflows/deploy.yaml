name: Deploy using SSH to Server

on: [push, workflow_dispatch]

jobs:
    build:
        runs-on: ubuntu-latest

        environment:
            name: ${{ github.ref_name }}

        concurrency:
            group:
                # only ever run one deploy job at a time
                ${{ github.workflow }}

        steps:
            - uses: actions/checkout@v3

            - name: Exporting environment variables
              env: ${{ secrets }}
              run: |
                  {
                      echo "# Generated from GitHub Actions on $(date)"
                      printenv | sort | grep -v '^(GITHUB_|DEPLOY_)'
                  } > .env

            - # https://github.com/marketplace/actions/ssh-deploy
              name: Deploy to server using SSH
              uses: easingthemes/ssh-deploy@main
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
                  ARGS: -rlgoDzc --stats -i --delete
                  SOURCE: /
                  TARGET: ~/${{ github.event.repository.name }}
                  REMOTE_HOST: ${{ vars.DEPLOY_HOST }}
                  REMOTE_USER: ${{ vars.DEPLOY_USER }}
                  EXCLUDE: /node_modules/
                  SCRIPT_BEFORE: |
                      cd ~/

                      # stop the app
                      if [ -d "${{ github.event.repository.name }}" ]; then
                          pushd "${{ github.event.repository.name }}"
                          docker compose down
                          popd
                      fi

                      # ensure yxorp is installed next to the app & up to date
                      if [ -d "yxorp" ]; then
                          pushd yxorp
                          docker compose down
                          git fetch
                          git pull
                          cp "../${{ github.event.repository.name }}/.env" .env
                          docker compose up -d --build
                          popd
                      else
                          git clone https://github.com/sxxov/yxorp
                          pushd yxorp
                          cp "../${{ github.event.repository.name }}/.env" .env
                          docker compose up -d --build
                          popd
                      fi
                  SCRIPT_AFTER: |
                      cd ~/${{ github.event.repository.name }}
                      docker compose up -d --build
